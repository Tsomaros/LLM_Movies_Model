[project]
name = "llm-movies"
version = "0.1.0"
description = "LLM movie predictor: calibrated worldwide revenue and audience score ranges"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
train = [
    "transformers>=5.22.2",
    "peft>=0.21.2",
    "accelerate>=1.15.0",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_movies"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 140
