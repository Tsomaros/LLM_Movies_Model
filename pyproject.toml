[project]
name = "llm-movies"
version = "0.1.0"
description = "LLM movie predictor: calibrated worldwide revenue and audience score ranges"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_movies"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 140
